[pytest]
# Pytest配置文件

# 测试文件发现模式
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 测试路径
testpaths = tests

# 命令行选项
addopts = 
    -v
    --tb=short
    --strict-markers

# 标记定义
markers =
    slow: 标记较慢的测试（如性能测试）
    regression: 回归测试
    unit: 单元测试
    integration: 集成测试

# 日志配置
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# 警告过滤
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
